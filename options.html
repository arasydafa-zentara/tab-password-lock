
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tab Password Lock Settings</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .wrap {
      max-width: 480px;
      margin: 60px auto;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin-top: 0; }
    h2 {
      font-size: 16px;
      margin: 24px 0 12px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
    }
    p { color: #6b7280; line-height: 1.5; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .add-row {
      display: flex;
      gap: 8px;
    }
    .add-row input {
      flex: 1;
      margin: 0;
    }
    .add-row button {
      width: auto;
      padding: 12px 18px;
      margin: 0;
      flex-shrink: 0;
    }
    #status {
      min-height: 20px;
      margin-top: 12px;
      font-size: 14px;
    }
    .whitelist {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .whitelist li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .whitelist li span {
      color: #374151;
    }
    .whitelist li button {
      width: auto;
      padding: 4px 10px;
      margin: 0;
      font-size: 12px;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: 6px;
    }
    .whitelist li button:hover {
      background: #fee2e2;
    }
    .empty {
      color: #9ca3af;
      font-size: 13px;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tab Password Lock</h1>
    <p>
      Set the password required before accessing whitelisted sites in this Chrome profile.
      The password itself is not stored; only a PBKDF2-derived hash and random salt are saved.
    </p>

    <input id="old-password" type="password" placeholder="Current password" autocomplete="current-password" style="display:none">
    <input id="password" type="password" placeholder="New password" autocomplete="new-password">
    <input id="confirm" type="password" placeholder="Confirm password" autocomplete="new-password">
    <button id="save">Save Password</button>

    <div id="status"></div>

    <h2>Whitelist</h2>
    <p>Add hostnames of sites you want to protect. Only these sites will show the lock screen.</p>

    <div class="add-row">
      <input id="new-host" type="text" placeholder="e.g. mail.google.com">
      <button id="add-host">Add</button>
    </div>

    <ul class="whitelist" id="whitelist"></ul>
  </div>

  <script src="options.js"></script>
</body>
</html>
